# Complete postgresql.conf for the pg service — loaded via config_file (compose command)
# Replaces the initdb-generated config, so it mirrors the image's generated active settings
# plus the tuning that config/mysql/my_custom*.cnf provides for MySQL

# Connections
listen_addresses = '*'
max_connections = 200
unix_socket_directories = '/var/run/postgresql'

# Memory (~25% RAM for the 2GB dev box, the innodb_buffer_pool_size analogue)
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 4MB
maintenance_work_mem = 128MB
dynamic_shared_memory_type = posix

# WAL
max_wal_size = 1GB
min_wal_size = 80MB

# Query statistics for slow-query monitoring (postgres_exporter -> Prometheus -> Grafana).
# track=top counts top-level statements only, avoiding double-counting of nested queries.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = top
pg_stat_statements.track_utility = off

# Slow query log equivalent: long_query_time=1 in my_custom.cnf
log_min_duration_statement = 1000ms
# Identify database/user in every log line; %q is empty in session processes.
log_line_prefix = '%m [%p] %q%u@%d '

# Time/locale — keep in sync with DEFAULT_TIME_ZONE (initdb bakes these in)
log_timezone = 'Europe/Moscow'
datestyle = 'iso, mdy'
timezone = 'Europe/Moscow'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
